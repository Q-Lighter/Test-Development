<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ragdoll & Cloth Physics Engine Sandbox</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      max-width: 250px;
    }
    button {
      background: #3498db;
      border: none;
      color: white;
      padding: 8px 14px;
      margin: 5px 2px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    button:hover { background: #2980b9; }
    p { margin: 5px 0 10px 0; font-size: 14px; color: #ccc; }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #3498db;
      z-index: 50;
      pointer-events: none;
    }
  </style>
  
  <!-- Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "@dimforge/rapier3d-compat": "https://unpkg.com/@dimforge/rapier3d-compat@0.12.0/rapier.es.js"
      }
    }
  </script>
</head>
<body>

  <div id="loading">Loading Physics Engine & 3D Environment...</div>

  <div id="ui">
    <h3>Character Physics Lab</h3>
    <p>Clothing Options:</p>
    <button id="btn-cape">Equip Flowing Cape</button>
    <button id="btn-poncho">Equip Heavy Poncho</button>
    <button id="btn-naked">Remove Clothing</button>
    <hr style="border: 0.5px solid #444; margin: 10px 0;">
    <button id="btn-drop">Drop Ragdoll (Reset)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import RAPIER from '@dimforge/rapier3d-compat';

    async function startApp() {
      try {
        // 1. Initialize Physics WebAssembly first
        await RAPIER.init();
        document.getElementById('loading').style.display = 'none';

        const world = new RAPIER.World({ x: 0.0, y: -9.81, z: 0.0 });

        // Ground Physics Body
        const groundBodyDesc = RAPIER.RigidBodyDesc.fixed();
        const groundBody = world.createRigidBody(groundBodyDesc);
        const groundCollider = RAPIER.ColliderDesc.cuboid(15, 0.1, 15);
        world.createCollider(groundCollider, groundBody);

        // 2. SCENE SETUP
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2, 0);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 12, 5);
        sun.castShadow = true;
        scene.add(sun);

        // Ground Mesh
        const floorMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(30, 30),
          new THREE.MeshStandardMaterial({ color: 0x22222e, roughness: 0.8 })
        );
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // 3. PROCEDURAL RAGDOLL CHARACTER
        let ragdollParts = [];

        function buildLimb(x, y, z, w, h, d, color = 0xd1a384) {
          const bodyDesc = RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, z);
          const body = world.createRigidBody(bodyDesc);
          const colliderDesc = RAPIER.ColliderDesc.cuboid(w / 2, h / 2, d / 2);
          world.createCollider(colliderDesc, body);

          const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(w, h, d),
            new THREE.MeshStandardMaterial({ color, roughness: 0.4 })
          );
          mesh.castShadow = true;
          scene.add(mesh);

          const part = { body, mesh };
          ragdollParts.push(part);
          return part;
        }

        // Character Parts
        const torso = buildLimb(0, 3.5, 0, 0.6, 0.8, 0.3, 0x34495e);
        const head = buildLimb(0, 4.3, 0, 0.4, 0.4, 0.4, 0xe74c3c);
        const armL = buildLimb(-0.55, 3.5, 0, 0.25, 0.7, 0.25);
        const armR = buildLimb(0.55, 3.5, 0, 0.25, 0.7, 0.25);
        const legL = buildLimb(-0.2, 2.5, 0, 0.25, 0.8, 0.25, 0x2c3e50);
        const legR = buildLimb(0.2, 2.5, 0, 0.25, 0.8, 0.25, 0x2c3e50);

        function connectJoints(partA, partB, anchorA, anchorB) {
          const jointParams = RAPIER.JointData.spherical(anchorA, anchorB);
          world.createJoint(jointParams, partA.body, partB.body, true);
        }

        connectJoints(torso, head, { x: 0, y: 0.45, z: 0 }, { x: 0, y: -0.25, z: 0 });
        connectJoints(torso, armL, { x: -0.35, y: 0.35, z: 0 }, { x: 0, y: 0.35, z: 0 });
        connectJoints(torso, armR, { x: 0.35, y: 0.35, z: 0 }, { x: 0, y: 0.35, z: 0 });
        connectJoints(torso, legL, { x: -0.2, y: -0.45, z: 0 }, { x: 0, y: 0.4, z: 0 });
        connectJoints(torso, legR, { x: 0.2, y: -0.45, z: 0 }, { x: 0, y: 0.4, z: 0 });

        // 4. CLOTH SIMULATION CLASS
        class Cloth {
          constructor(cols, rows, spacing, color) {
            this.cols = cols;
            this.rows = rows;
            this.spacing = spacing;
            this.particles = [];
            this.constraints = [];

            for (let r = 0; r <= rows; r++) {
              for (let c = 0; c <= cols; c++) {
                this.particles.push({
                  pos: new THREE.Vector3((c - cols / 2) * spacing, 3.8 - r * spacing, -0.2),
                  oldPos: new THREE.Vector3((c - cols / 2) * spacing, 3.8 - r * spacing, -0.2),
                  acc: new THREE.Vector3(0, -9.81, 0),
                  pinned: r === 0
                });
              }
            }

            const getIdx = (c, r) => r * (cols + 1) + c;
            for (let r = 0; r <= rows; r++) {
              for (let c = 0; c <= cols; c++) {
                if (c < cols) this.constraints.push([getIdx(c, r), getIdx(c + 1, r), spacing]);
                if (r < rows) this.constraints.push([getIdx(c, r), getIdx(c, r + 1), spacing]);
              }
            }

            this.geometry = new THREE.PlaneGeometry(cols * spacing, rows * spacing, cols, rows);
            this.mesh = new THREE.Mesh(this.geometry, new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide, roughness: 0.6 }));
            this.mesh.castShadow = true;
            scene.add(this.mesh);
          }

          update(dt, anchorBody) {
            const torsoPos = anchorBody.translation();
            const torsoRot = anchorBody.rotation();
            const quat = new THREE.Quaternion(torsoRot.x, torsoRot.y, torsoRot.z, torsoRot.w);

            this.particles.forEach((p, idx) => {
              if (p.pinned) {
                const col = idx % (this.cols + 1);
                const offset = new THREE.Vector3((col - this.cols / 2) * this.spacing, 0.35, -0.16).applyQuaternion(quat);
                p.pos.set(torsoPos.x + offset.x, torsoPos.y + offset.y, torsoPos.z + offset.z);
                p.oldPos.copy(p.pos);
              } else {
                const vel = p.pos.clone().sub(p.oldPos).multiplyScalar(0.96);
                p.oldPos.copy(p.pos);
                p.pos.add(vel).addScaledVector(p.acc, dt * dt);
              }
            });

            for (let i = 0; i < 5; i++) {
              this.constraints.forEach(([i1, i2, dist]) => {
                const p1 = this.particles[i1];
                const p2 = this.particles[i2];
                const delta = p2.pos.clone().sub(p1.pos);
                const currentDist = delta.length();
                if (currentDist === 0) return;
                const correction = delta.multiplyScalar(0.5 * (currentDist - dist) / currentDist);
                if (!p1.pinned) p1.pos.add(correction);
                if (!p2.pinned) p2.pos.sub(correction);
              });
            }

            const positions = this.geometry.attributes.position;
            this.particles.forEach((p, i) => positions.setXYZ(i, p.pos.x, p.pos.y, p.pos.z));
            positions.needsUpdate = true;
            this.geometry.computeVertexNormals();
          }

          destroy() {
            scene.remove(this.mesh);
            this.geometry.dispose();
          }
        }

        let activeCloth = new Cloth(10, 10, 0.08, 0x9b59b6);

        // UI Binding
        document.getElementById('btn-cape').onclick = () => { if (activeCloth) activeCloth.destroy(); activeCloth = new Cloth(10, 12, 0.07, 0xe74c3c); };
        document.getElementById('btn-poncho').onclick = () => { if (activeCloth) activeCloth.destroy(); activeCloth = new Cloth(16, 8, 0.07, 0xf1c40f); };
        document.getElementById('btn-naked').onclick = () => { if (activeCloth) activeCloth.destroy(); activeCloth = null; };
        document.getElementById('btn-drop').onclick = () => {
          torso.body.setTranslation({ x: 0, y: 5, z: 0 }, true);
          torso.body.setLinvel({ x: (Math.random() - 0.5) * 4, y: 2, z: (Math.random() - 0.5) * 4 }, true);
        };

        // Loop
        const clock = new THREE.Clock();
        function animate() {
          requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.03);
          world.step();

          ragdollParts.forEach(part => {
            const p = part.body.translation();
            const r = part.body.rotation();
            part.mesh.position.set(p.x, p.y, p.z);
            part.mesh.quaternion.set(r.x, r.y, r.z, r.w);
          });

          if (activeCloth) activeCloth.update(dt, torso.body);
          renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };

      } catch (err) {
        document.getElementById('loading').innerText = "Error loading simulation: " + err.message;
        console.error(err);
      }
    }

    startApp();
  </script>
</body>
</html>
